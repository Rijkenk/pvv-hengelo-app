name: Agenda Hengelo ophalen
on:
  schedule:
    - cron: "17 4 * * *"   # elke nacht
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verbinding met Notubiz testen
        continue-on-error: true
        run: |
          getent ahosts api.notubiz.nl || true
          curl -4 -sS -m 20 -o /dev/null -w "IPv4: %{http_code}\n" "https://api.notubiz.nl/organisations/1734?format=json" || true
          curl -6 -sS -m 20 -o /dev/null -w "IPv6: %{http_code}\n" "https://api.notubiz.nl/organisations/1734?format=json" || true
      - run: python3 scripts/notubiz_agenda.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data.json notubiz-org.json || true
          git diff --cached --quiet || git commit -m "Agenda Hengelo bijgewerkt" && git push
